name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - public/download/lindendorf.apk
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci
      - run: npm run android:apk

      - name: Commit APK for Vercel
        run: |
          if git diff --quiet -- public/download/lindendorf.apk; then
            echo "APK is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download/lindendorf.apk
          git commit -m "chore: update Android APK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
